<svg xmlns="http://www.w3.org/2000/svg" viewBox="-71 -71 142 142">
  <defs>
    <mask id="planet-hole" maskUnits="userSpaceOnUse" x="-16" y="-16" width="32" height="32">
      <circle r="15" fill="#fff"/>
      <circle r="5" fill="#000"/>
    </mask>
    <mask id="sun-hole" maskUnits="userSpaceOnUse" x="-19" y="-19" width="38" height="38">
      <circle r="18" fill="#fff"/>
      <circle r="5.5" fill="#000"/>
    </mask>
    <g id="planet" mask="url(#planet-hole)">
      <circle r="10.5" fill="#fff"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(45)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(90)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(135)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(180)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(225)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(270)"/>
      <rect x="-2" y="-15" width="4" height="5" fill="#fff" transform="rotate(315)"/>
    </g>
    <g id="sun" mask="url(#sun-hole)">
      <circle r="13" fill="#fff"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(30)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(60)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(90)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(120)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(150)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(180)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(210)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(240)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(270)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(300)"/>
      <rect x="-2" y="-18" width="4" height="6" fill="#fff" transform="rotate(330)"/>
    </g>
    <g id="ring-teeth" fill="#fff">
      <rect x="-1.5" y="-50" width="3" height="7"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(15)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(30)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(45)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(60)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(75)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(90)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(105)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(120)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(135)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(150)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(165)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(180)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(195)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(210)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(225)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(240)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(255)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(270)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(285)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(300)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(315)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(330)"/>
      <rect x="-1.5" y="-50" width="3" height="7" transform="rotate(345)"/>
    </g>
  </defs>
  <g fill="none" stroke="#fff">
    <circle r="67" stroke-width="7"/>
    <circle r="59" stroke-width="2"/>
    <circle r="52" stroke-width="3"/>
  </g>
  <use href="#ring-teeth"/>
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 0V-30"/>
    <path d="M0 0V-30" transform="rotate(120)"/>
    <path d="M0 0V-30" transform="rotate(240)"/>
  </g>
  <use href="#sun"/>
  <use href="#planet" transform="translate(0 -30)"/>
  <use href="#planet" transform="rotate(120) translate(0 -30)"/>
  <use href="#planet" transform="rotate(240) translate(0 -30)"/>
  <circle r="3" fill="#fff"/>
</svg>
