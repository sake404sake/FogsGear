<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ギアデザイン案 | Fogs Gear</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Yu Gothic UI", "Meiryo", sans-serif;
            background: #100e0c;
            color: #f2e4c7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 740px;
            padding: 34px clamp(20px, 4vw, 64px) 42px;
            background:
                radial-gradient(ellipse at 50% 35%, rgba(100, 68, 35, .22), transparent 62%),
                #100e0c;
        }
        header { max-width: 1200px; margin: 0 auto 22px; }
        .eyebrow {
            color: #d4af68;
            font: 700 12px/1.4 ui-monospace, monospace;
            letter-spacing: .22em;
        }
        h1 { margin: 8px 0; font-size: clamp(23px, 3vw, 34px); }
        header p { margin: 0; color: #b9aa92; font-size: 14px; }
        .sheet {
            max-width: 1280px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #57452e;
            border-radius: 16px;
            background: linear-gradient(155deg, rgba(43, 34, 25, .96), rgba(22, 19, 16, .98));
            box-shadow: 0 22px 70px #0009, inset 0 1px #ffffff0a;
        }
        svg { display: block; width: 100%; height: auto; }
        .gear { color: #b9b4aa; }
        .rim-outer { fill: none; stroke: #fff; stroke-width: 7; }
        .rim-inner { fill: none; stroke: #fff; stroke-width: 2; opacity: 1; }
        .spoke-edge { stroke: #fff; stroke-linecap: round; }
        .spoke { stroke: #fff; stroke-linecap: round; }
        .hub { fill: #fff; stroke: #fff; stroke-width: 3; }
        .axle { fill: #fff; stroke: #fff; stroke-width: 3; }
        .bolt { fill: #fff; stroke: #fff; stroke-width: 2; }
        .screw-head { fill: #fff; stroke: #fff; stroke-width: 2; }
        .caption { fill: #f1e5cc; font-size: 19px; font-weight: 700; text-anchor: middle; }
        .tag { fill: #d2aa60; font: 700 10px ui-monospace, monospace; letter-spacing: .16em; text-anchor: middle; }
        .detail { fill: #b9aa92; font-size: 11px; text-anchor: middle; }
        .guide { fill: none; stroke: #ffffff12; stroke-width: 1; }
        .chain-link { fill: none; stroke: #fff; stroke-width: 2.6; }
        .chain-pin { fill: none; stroke: #fff; stroke-width: 2; }
        .alchemy-plate { fill: #fff; stroke: #fff; stroke-width: 2; }
        .alchemy-etch { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
        .gear-tooth { fill: #fff; stroke: none; }
        .clock-ring { fill: none; stroke: #fff; stroke-width: 2; }
        .clock-face { fill: none; fill-rule: evenodd; stroke: #fff; stroke-width: 2; }
        .clock-mark { stroke: #fff; stroke-width: 1.8; stroke-linecap: round; }
        .clock-minute-mark { stroke: #fff; stroke-width: 1; stroke-linecap: round; }
        .clock-hand { fill: #fff; stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; }
        .clock-hour-hand { fill: #fff; stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; }
        .clock-hand-inlay { fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; }
        .clock-numeral { fill: #fff; font-family: Georgia, "Times New Roman", serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
        .layer-gold { fill: #d4af37; stroke: #f3df91; }
        .layer-silver { fill: #b5b8b1; stroke: #e6eae3; }
        .layer-copper { fill: #b87333; stroke: #f3b06c; }
        .gear { color: #fff; }
        .gear * { fill: #fff; stroke: #fff; }
        .gear [fill="none"] { fill: none !important; }
        .gear .rim-outer { fill: none; stroke: #fff; }
        .gear .rim-inner { fill: none; stroke: #fff; opacity: 1; }
        .gear .spoke-edge { stroke: #fff; }
        .gear .spoke { stroke: #fff; }
        .gear .hub { fill: #fff; stroke: #fff; }
        .gear .axle { fill: #fff; stroke: #fff; }
        .gear .chain-link { fill: none; stroke: #fff; }
        .gear .chain-pin { fill: none; stroke: #fff; }
        .gear .gear-tooth { fill: #fff; stroke: none; }
        .gear .alchemy-plate { fill: #fff; fill-opacity: 1; stroke: #fff; }
        .gear .alchemy-etch,
        .gear .clock-hand-inlay { fill: none; stroke: #fff; }
        .gear .clock-ring { fill: none; stroke: #fff; }
        .gear .clock-face { fill: none; stroke: #fff; }
        .gear .clock-ring,
        .gear .clock-mark,
        .gear .clock-minute-mark { stroke: #fff; }
        .gear .clock-numeral { fill: #fff; }
        .gear .clock-hand,
        .gear .clock-hour-hand { fill: #fff; stroke: #fff; stroke-width: 2; }
        .gear .clock-hand-inlay,
        .gear .screw-slot { fill: none; stroke: #fff; }
        .gear .alpha-preview { fill: url(#alpha-checker) !important; stroke: none !important; }
        @media (max-width: 760px) {
            body { min-width: 0; padding: 20px 10px; }
            .sheet { overflow-x: auto; }
            svg { min-width: 900px; }
        }
    </style>
</head>
