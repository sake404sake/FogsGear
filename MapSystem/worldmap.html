<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steampunk Explorer - World Map (全体マップ)</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <style>
        body {
            padding: 20px;
            overflow-y: auto;
        }
        .map-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }
        #fullMapCanvas {
            background: #120e0c;
            border: 2px solid var(--border-gold);
            border-radius: 6px;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            cursor: grab;
        }
        #fullMapCanvas:active {
            cursor: grabbing;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 4px;
            max-height: min(260px, 32vh);
            margin: 0;
            padding: 8px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .world-legend-disclosure {
            margin: 8px 0 12px;
            border: 1px solid rgba(98, 194, 170, 0.32);
            border-radius: 4px;
            background: rgba(18, 14, 12, 0.72);
            text-align: left;
        }
        .world-legend-disclosure > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 38px;
            padding: 0 12px;
            color: #a7f0d9;
            cursor: pointer;
            font: 600 0.75rem monospace;
            list-style: none;
        }
        .world-legend-disclosure > summary::-webkit-details-marker { display: none; }
        .world-legend-disclosure > summary::after { content: '+'; color: #f3c653; font-size: 1rem; }
        .world-legend-disclosure[open] > summary { border-bottom: 1px solid rgba(98, 194, 170, 0.24); }
        .world-legend-disclosure[open] > summary::after { content: '\2212'; }
        .world-legend-count { margin-left: auto; margin-right: 10px; color: var(--text-muted); font: 0.65rem monospace; }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            box-sizing: border-box;
            padding: 4px 7px;
            border: 1px solid rgba(98, 194, 170, 0.12);
            background: rgba(98, 194, 170, 0.04);
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            border: 1px solid var(--border-sub);
        }
        .actions-bar {
            margin: 16px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .current-area {
            margin: 8px 0 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .current-area strong {
            color: var(--accent-gold);
        }
        .map-options {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 12px;
        }
        .map-view-toggle { display: inline-flex; gap: 4px; padding: 3px; background: rgba(18, 14, 12, 0.75); border: 1px solid rgba(98, 194, 170, 0.32); border-radius: 5px; }
        .map-view-toggle .btn { min-width: 0; padding: 6px 12px; }
        .map-view-toggle .btn[aria-pressed="true"] { color: #17120f; background: linear-gradient(180deg, #f3c653, #b8832d); border-color: #ffe69b; }
        .map-options .btn {
            min-width: 170px;
        }
        @media (max-width: 620px) {
            body {
                padding: 8px;
            }
            .map-wrapper {
                width: 100%;
                box-sizing: border-box;
            }
            .map-options .btn,
            .actions-bar .btn {
                width: 100%;
                min-width: 0;
            }
            .map-view-toggle { width: 100%; }
            .map-view-toggle .btn { width: auto; flex: 1 1 0; }
            .actions-bar {
                margin: 12px 0 4px;
            }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-panel"><div class="loading-spinner"></div><div id="loadingMessage">全体マップを読み込んでいます...</div><div class="loading-progress" aria-label="全体マップ読み込み中"></div></div>
    </div>
    <div class="panel map-wrapper">
        <h1>STEAMPUNK WORLD MAP</h1>
        <div class="rule-text" style="margin-bottom: 10px;">
            外洋孤島の全体マップです。ドラッグで移動、マウスホイールまたはピンチ操作で拡大縮小できます。
        </div>

        <details class="world-legend-disclosure">
            <summary><span>セル凡例</span><span id="worldLegendCount" class="world-legend-count"></span></summary>
            <div id="worldLegend" class="legend" aria-label="セル凡例一覧"></div>
        </details>
        <div id="currentArea" class="current-area" aria-live="polite"></div>
        <div class="map-options">
            <div class="map-view-toggle" role="group" aria-label="表示するマップ">
                <button class="btn btn-action active" id="showCurrentMap" type="button" aria-pressed="true">現在マップ</button>
                <button class="btn btn-action" id="showInitialMap" type="button" aria-pressed="false">初期マップ</button>
            </div>
            <button class="btn btn-action" id="toggleLabels" type="button" aria-pressed="true">地域ラベルを非表示</button>
        </div>

        <div style="position: relative;">
            <canvas id="fullMapCanvas" width="800" height="600"></canvas>
        </div>

        <div class="actions-bar">
            <button class="btn btn-action" id="backToGame">ゲーム画面に戻る</button>
        </div>
    </div>

    <script type="module">
        import { MapGenerator, loadMapSnapshot, saveMapSnapshot } from './js/mapGenerator.js?v=89';
        import { CELL_DEFINITIONS, getMosaicColor } from './js/cellRules.js?v=4';
        import { buildTerritoryBorderSegments } from './js/territoryBorders.js?v=35';
        import { drawCellIcon, loadCellIconAtlas } from './js/cellIconRenderer.js?v=3';
        import { WORLD_CELL_TYPES, applyCellChanges } from './js/worldCells.js?v=2';

        const cellIconAtlas = await loadCellIconAtlas().catch(() => null);

        const legendEl = document.getElementById('worldLegend');
        const legendItems = Object.values(WORLD_CELL_TYPES).map(({ label, color }) => ({ label, color }));
        legendItems.push({ label: '現在地 (Player)', color: '#ff0000' });
        document.getElementById('worldLegendCount').textContent = `${legendItems.length}項目`;
        legendEl.innerHTML = legendItems.map(item => `
            <div class="legend-item"><div class="legend-color" style="background-color:${item.color};"></div>${item.label}</div>
        `).join('');
        Array.from(document.querySelectorAll('.legend-color')).forEach((node) => {
            const label = node.parentElement?.textContent?.trim() || '';
            const match = legendItems.find((item) => label.startsWith(item.label));
            if (match) node.style.backgroundColor = match.color;
        });

        const canvas = document.getElementById('fullMapCanvas');
        const ctx = canvas.getContext('2d');
        const currentAreaEl = document.getElementById('currentArea');

        let settings = { seed: 'SteampunkIsland_01' };
        try {
            settings = { ...settings, ...JSON.parse(localStorage.getItem('steampunk_explorer_settings') || '{}') };
        } catch (error) {}
        const unlocks = (() => {
            try { return JSON.parse(localStorage.getItem('fogsgear_world_unlocks') || '{}'); }
            catch (error) { return {}; }
        })();
        const mainlandUnlocked = unlocks.mainland === true;
        const labelToggle = document.getElementById('toggleLabels');
        if (labelToggle) labelToggle.hidden = !mainlandUnlocked;
        const mapSize = mainlandUnlocked ? { width: 2000, height: 1000 } : { width: 640, height: 360 };
        const generator = new MapGenerator({ ...mapSize, seed: settings.seed, coastalOnly: !mainlandUnlocked });
        const generateMapInWorker = (seed) => new Promise((resolve, reject) => {
            const worker = new Worker('./js/mapWorker.js?v=89', { type: 'module' });
            worker.onmessage = (event) => {
                if (event.data?.type === 'complete') {
                    worker.terminate();
                    resolve(event.data.generated);
                } else if (event.data?.type === 'error') {
                    worker.terminate();
                    reject(new Error(event.data.message));
                }
            };
            worker.onerror = (error) => {
                worker.terminate();
                reject(error);
            };
            worker.postMessage({ ...mapSize, seed, coastalOnly: !mainlandUnlocked });
        });
        const loadingMessage = document.getElementById('loadingMessage');
        if (loadingMessage) loadingMessage.textContent = '保存済みの全体マップを読み込んでいます...';
        let generated = await loadMapSnapshot(settings.seed, mapSize.width, mapSize.height);
        if (!generated) {
            if (loadingMessage) loadingMessage.textContent = '全体マップを生成しています...';
            generated = await generateMapInWorker(settings.seed).catch(() => generator.generate(settings.seed));
            saveMapSnapshot(generated, settings.seed, mapSize.width, mapSize.height).catch(() => {});
        }
        const initialMapData = generated.worldMap || generated.grid;
        let mapData = initialMapData.map(row => row.map(tile => ({ ...tile, initialType: tile.type })));
        applyCellChanges(mapData, settings.seed);
        const currentMapData = mapData;
        const cols = mapData[0].length;
        const rows = mapData.length;
        const territories = generated.territories || [];
        const mainlandRegions = generated.mainlandRegions || [];

        const labels = [];
        const labelSeen = new Set();
        for (const territory of territories) {
            if (!territory || !territory.name || !territory.labelPos) continue;
            const labelPos = territory.labelPos;
            const key = `territory:${territory.id}:${territory.name}`;
            if (!labelSeen.has(key)) {
                labelSeen.add(key);
                const x = Number(labelPos.x);
                const y = Number(labelPos.y);
                if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
                const tile = mapData[Math.floor(y)]?.[Math.floor(x)];
                if (!tile || !tile.isLand || tile.isSea || tile.isLake || !tile.isMainland) continue;
                labels.push({ x, y, text: territory.name, kind: 'territory' });
            }
        }

        const primaryMainland = new Set();
        const visitedMainland = new Set();
        const isMainlandLand = (x, y) => {
            const tile = mapData[y]?.[x];
            return Boolean(tile && tile.isMainland && tile.isLand && !tile.isSea && !tile.isLake);
        };
        let largestMainland = [];
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const startKey = `${x},${y}`;
                if (visitedMainland.has(startKey) || !isMainlandLand(x, y)) continue;
                const component = [];
                const queue = [[x, y]];
                visitedMainland.add(startKey);
                while (queue.length) {
                    const [currentX, currentY] = queue.pop();
                    component.push([currentX, currentY]);
                    for (const [offsetX, offsetY] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                        const nextX = currentX + offsetX;
                        const nextY = currentY + offsetY;
                        const nextKey = `${nextX},${nextY}`;
                        if (visitedMainland.has(nextKey) || !isMainlandLand(nextX, nextY)) continue;
                        visitedMainland.add(nextKey);
                        queue.push([nextX, nextY]);
                    }
                }
                if (component.length > largestMainland.length) largestMainland = component;
            }
        }
        largestMainland.forEach(([x, y]) => primaryMainland.add(`${x},${y}`));

        function drawMapLabels(viewLeft, viewTop) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '600 16px Georgia, "Times New Roman", serif';

            for (const label of labels) {
                if (!label || !label.text || !String(label.text).trim()) continue;
                const x = Number(label.x);
                const y = Number(label.y);
                if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
                const worldX = (x >= 0 && x <= cols) ? x * 32 + 16 : x;
                const worldY = (y >= 0 && y <= rows) ? y * 32 + 16 : y;
                const screenX = (worldX - viewLeft) * zoom;
                const screenY = (worldY - viewTop) * zoom;
                if (screenX < -140 || screenX > canvas.width + 140 || screenY < -30 || screenY > canvas.height + 30) continue;
                const labelWidth = ctx.measureText(String(label.text)).width + 44;
                const labelHeight = 34;
                const left = screenX - labelWidth / 2;
                const top = screenY - labelHeight / 2;
                const radius = 5;

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 3;
                ctx.beginPath();
                ctx.roundRect(left, top, labelWidth, labelHeight, radius);
                const plate = ctx.createLinearGradient(left, top, left, top + labelHeight);
                plate.addColorStop(0, 'rgba(31, 52, 42, 0.94)');
                plate.addColorStop(1, 'rgba(18, 29, 25, 0.94)');
                ctx.fillStyle = plate;
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = 'rgba(238, 199, 111, 0.92)';
                ctx.stroke();

                ctx.beginPath();
                ctx.roundRect(left + 3, top + 3, labelWidth - 6, labelHeight - 6, radius - 1);
                ctx.lineWidth = 0.7;
                ctx.strokeStyle = 'rgba(238, 199, 111, 0.28)';
                ctx.stroke();

                ctx.strokeStyle = 'rgba(238, 199, 111, 0.72)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(left + 10, screenY);
                ctx.lineTo(left + 17, screenY);
                ctx.moveTo(left + labelWidth - 17, screenY);
                ctx.lineTo(left + labelWidth - 10, screenY);
                ctx.stroke();

                ctx.fillStyle = '#f4dfad';
                ctx.fillText(String(label.text), screenX, screenY + 1);
                ctx.restore();
            }
            ctx.restore();
        }

        const createOverviewCanvas = (sourceMap) => {
            const overview = document.createElement('canvas');
            overview.width = cols;
            overview.height = rows;
            const overviewContext = overview.getContext('2d');
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = sourceMap[y][x];
                    overviewContext.fillStyle = getMosaicColor(tile.color || '#526f4e', x, y);
                    overviewContext.fillRect(x, y, 1, 1);
                }
            }
            return overview;
        };
        const currentOverviewCanvas = createOverviewCanvas(mapData);
        let initialOverviewCanvas = null;
        let overviewCanvas = currentOverviewCanvas;
        let mapViewMode = 'current';

        const minAllowedZoom = Math.min(canvas.width / (cols * 32), canvas.height / (rows * 32));
        let landMinX = Infinity;
        let landMaxX = -Infinity;
        let landMinY = Infinity;
        let landMaxY = -Infinity;
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const tile = mapData[y][x];
                if (!tile || tile.isOcean || tile.isLake) continue;
                landMinX = Math.min(landMinX, x);
                landMaxX = Math.max(landMaxX, x);
                landMinY = Math.min(landMinY, y);
                landMaxY = Math.max(landMaxY, y);
            }
        }

        const worldMinX = Number.isFinite(landMinX) ? landMinX - 1 : 0;
        const worldMaxX = Number.isFinite(landMaxX) ? landMaxX + 1 : cols - 1;
        const worldMinY = Number.isFinite(landMinY) ? landMinY - 1 : 0;
        const worldMaxY = Number.isFinite(landMaxY) ? landMaxY + 1 : rows - 1;
        const worldSpanX = Math.max(1, (worldMaxX - worldMinX + 1) * 32);
        const worldSpanY = Math.max(1, (worldMaxY - worldMinY + 1) * 32);
        const fitZoom = Math.min(canvas.width / worldSpanX, canvas.height / worldSpanY);

        const focusCenterX = Number.isFinite(landMinX) ? (worldMinX + worldMaxX) / 2 : Math.floor(cols * (mainlandUnlocked ? 0.76 : 0.5));
        const focusCenterY = Number.isFinite(landMinY) ? (worldMinY + worldMaxY) / 2 : Math.floor(rows * 0.60);
        const initialFit = mainlandUnlocked ? 0.94 : 0.78;
        let zoom = Math.max(minAllowedZoom, Math.min(4.0, fitZoom * initialFit));
        let cameraX = (focusCenterX + 0.5) * 32;
        let cameraY = (focusCenterY + 0.5) * 32;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let cameraStart = { x: 0, y: 0 };
        const activePointers = new Map();
        let pinchStartDistance = 0;
        let pinchStartZoom = zoom;
        let pinchStartCenter = { x: 0, y: 0 };
        let pinchStartWorldCenter = { x: cameraX, y: cameraY };
        let labelsVisible = true;
        let renderQueued = false;

        const scheduleRender = () => {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(() => {
                renderQueued = false;
                drawFullMap();
            });
        };

        const setMapView = (mode) => {
            if (mapViewMode === mode) return;
            mapViewMode = mode;
            if (mode === 'initial') {
                mapData = initialMapData;
                if (!initialOverviewCanvas) initialOverviewCanvas = createOverviewCanvas(initialMapData);
                overviewCanvas = initialOverviewCanvas;
            } else {
                mapData = currentMapData;
                overviewCanvas = currentOverviewCanvas;
            }
            cachedTerritoryBorders = null;
            currentAreaEl.innerHTML = `現在地の領域: <strong>${getCurrentArea()}</strong>`;
            document.getElementById('showInitialMap').setAttribute('aria-pressed', String(mode === 'initial'));
            document.getElementById('showCurrentMap').setAttribute('aria-pressed', String(mode === 'current'));
            document.getElementById('showInitialMap').classList.toggle('active', mode === 'initial');
            document.getElementById('showCurrentMap').classList.toggle('active', mode === 'current');
            scheduleRender();
        };
        document.getElementById('showInitialMap').addEventListener('click', () => setMapView('initial'));
        document.getElementById('showCurrentMap').addEventListener('click', () => setMapView('current'));

        const getPointerCenter = () => {
            const points = [...activePointers.values()];
            return {
                x: points.reduce((sum, point) => sum + point.x, 0) / points.length,
                y: points.reduce((sum, point) => sum + point.y, 0) / points.length
            };
        };

        const getPointerDistance = () => {
            const points = [...activePointers.values()];
            if (points.length < 2) return 0;
            return Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
        };

        const beginPinch = () => {
            const rect = canvas.getBoundingClientRect();
            const center = getPointerCenter();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            pinchStartDistance = Math.max(1, getPointerDistance());
            pinchStartZoom = zoom;
            pinchStartCenter = {
                x: (center.x - rect.left) * scaleX,
                y: (center.y - rect.top) * scaleY
            };
            pinchStartWorldCenter = {
                x: cameraX - canvas.width / (2 * zoom) + pinchStartCenter.x / zoom,
                y: cameraY - canvas.height / (2 * zoom) + pinchStartCenter.y / zoom
            };
        };

        const updatePinch = () => {
            const rect = canvas.getBoundingClientRect();
            const center = getPointerCenter();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const centerX = (center.x - rect.left) * scaleX;
            const centerY = (center.y - rect.top) * scaleY;
            const targetZoom = Math.min(4.0, Math.max(minAllowedZoom, pinchStartZoom * getPointerDistance() / pinchStartDistance));
            zoom = targetZoom;
            cameraX = pinchStartWorldCenter.x - centerX / zoom + canvas.width / (2 * zoom);
            cameraY = pinchStartWorldCenter.y - centerY / zoom + canvas.height / (2 * zoom);
            scheduleRender();
        };

        let playerX = Number.isInteger(generated.playerPos?.x) ? generated.playerPos.x : Math.floor(focusCenterX);
        let playerY = Number.isInteger(generated.playerPos?.y) ? generated.playerPos.y : Math.floor(focusCenterY);
        let savedPlayer = null;
        try {
            savedPlayer = JSON.parse(localStorage.getItem('steampunk_explorer_player_pos') || 'null');
        } catch (error) {}
        if (savedPlayer && savedPlayer.spawnVersion === 4 && savedPlayer.seed === settings.seed && Number.isInteger(savedPlayer.x) && Number.isInteger(savedPlayer.y) && savedPlayer.x >= 0 && savedPlayer.x < cols && savedPlayer.y >= 0 && savedPlayer.y < rows && mapData[savedPlayer.y][savedPlayer.x].isLand && !mapData[savedPlayer.y][savedPlayer.x].isLake) {
            playerX = savedPlayer.x;
            playerY = savedPlayer.y;
        } else if (!Number.isInteger(generated.playerPos?.x) || !Number.isInteger(generated.playerPos?.y)) {
            for (let radius = 0; radius < Math.max(cols, rows); radius++) {
                let found = false;
                for (let dy = -radius; dy <= radius && !found; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const x = Math.floor(cols / 2) + dx;
                        const y = Math.floor(rows / 2) + dy;
                        if (x >= 0 && x < cols && y >= 0 && y < rows && mapData[y][x].isLand && !mapData[y][x].isLake) {
                            playerX = x;
                            playerY = y;
                            found = true;
                            break;
                        }
                    }
                }
                if (found) break;
            }
        }

        const getCurrentArea = () => {
            const tile = mapData[playerY]?.[playerX];
            if (!tile || tile.isSea || tile.isOcean || tile.isLake || tile.type === 'SEA' || tile.type === 'LAKE') return '海';
            if (!tile.isMainland || tile.territoryId < 0) return '孤島';
            return territories.find((territory) => territory.territoryId === tile.territoryId || territory.id === tile.territoryId)?.name || '不明な領域';
        };
        currentAreaEl.innerHTML = `現在地の領域: <strong>${getCurrentArea()}</strong>`;

        let cachedTerritoryBorders = null;

        function drawTerritoryBorders(startCol, endCol, startRow, endRow) {
            const tileSize = 32;
            if (cachedTerritoryBorders === null) {
                cachedTerritoryBorders = buildTerritoryBorderSegments(mapData);
            }
            const drawBorder = (x1, y1, x2, y2) => {
                ctx.beginPath();
                ctx.moveTo(x1 * tileSize, y1 * tileSize);
                ctx.lineTo(x2 * tileSize, y2 * tileSize);
                ctx.stroke();
            };
            ctx.save();
            ctx.lineCap = 'butt';
            ctx.strokeStyle = zoom < 0.05 ? 'rgba(210, 45, 45, 0.92)' : '#d22d2d';
            ctx.lineWidth = 1.8 / zoom;
            ctx.setLineDash([6 / zoom, 6 / zoom]);
            cachedTerritoryBorders.forEach(({ x1, y1, x2, y2, pair }) => {
                if (Math.max(x1, x2) < startCol || Math.min(x1, x2) > endCol || Math.max(y1, y2) < startRow || Math.min(y1, y2) > endRow) return;
                drawBorder(x1, y1, x2, y2);
            });
            ctx.restore();
        }

        function drawFullMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const viewW = canvas.width / zoom;
            const viewH = canvas.height / zoom;
            const left = cameraX - viewW / 2;
            const top = cameraY - viewH / 2;

            ctx.save();
            ctx.scale(zoom, zoom);
            ctx.translate(-left, -top);

            const tileSize = 32;
            const startCol = Math.max(0, Math.floor(left / tileSize));
            const endCol = Math.min(cols, Math.ceil((left + viewW) / tileSize));
            const startRow = Math.max(0, Math.floor(top / tileSize));
            const endRow = Math.min(rows, Math.ceil((top + viewH) / tileSize));

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(overviewCanvas, 0, 0, cols, rows, 0, 0, cols * tileSize, rows * tileSize);
            if (cellIconAtlas && tileSize * zoom >= 14) {
                const iconSize = tileSize * 0.58;
                const iconOffset = (tileSize - iconSize) / 2;
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.imageSmoothingEnabled = true;
                for (let y = startRow; y < endRow; y++) {
                    for (let x = startCol; x < endCol; x++) {
                        drawCellIcon(ctx, cellIconAtlas, mapData[y][x], x * tileSize + iconOffset, y * tileSize + iconOffset, iconSize);
                    }
                }
                ctx.restore();
            }
            drawTerritoryBorders(startCol, endCol, startRow, endRow);
            ctx.restore();

            if (labelsVisible) drawMapLabels(left, top);

            const playerWorldX = (playerX + 0.5) * tileSize;
            const playerWorldY = (playerY + 0.5) * tileSize;
            const screenX = (playerWorldX - left) * zoom;
            const screenY = (playerWorldY - top) * zoom;

            if (screenX >= -10 && screenX <= canvas.width + 10 && screenY >= -10 && screenY <= canvas.height + 10) {
                ctx.save();
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 0, 0, 0.55)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

        }

        function drawWaterCoastline(startCol, endCol, startRow, endRow, tileSize) {
            return;
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pivotX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const pivotY = (e.clientY - rect.top) * (canvas.height / rect.height);

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            const targetZoom = Math.min(4.0, Math.max(minAllowedZoom, zoom * zoomFactor));
            if (targetZoom === zoom) return;

            const viewW = canvas.width / zoom;
            const viewH = canvas.height / zoom;
            const worldPivotX = (cameraX - viewW / 2) + pivotX / zoom;
            const worldPivotY = (cameraY - viewH / 2) + pivotY / zoom;

            zoom = targetZoom;

            const newViewW = canvas.width / zoom;
            const newViewH = canvas.height / zoom;
            cameraX = worldPivotX - pivotX / zoom + newViewW / 2;
            cameraY = worldPivotY - pivotY / zoom + newViewH / 2;
            scheduleRender();
        }, { passive: false });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            try { canvas.setPointerCapture(e.pointerId); } catch (error) {}

            if (activePointers.size === 1) {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                cameraStart = { x: cameraX, y: cameraY };
            } else if (activePointers.size === 2) {
                isDragging = false;
                beginPinch();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!activePointers.has(e.pointerId)) return;
            e.preventDefault();
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size >= 2) {
                updatePinch();
            } else if (activePointers.size === 1 && isDragging) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const dx = (e.clientX - dragStart.x) * scaleX / zoom;
                const dy = (e.clientY - dragStart.y) * scaleY / zoom;

                cameraX = cameraStart.x - dx;
                cameraY = cameraStart.y - dy;
                scheduleRender();
            }
        });

        const handlePointerUp = (e) => {
            if (canvas.hasPointerCapture(e.pointerId)) {
                try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            }
            activePointers.delete(e.pointerId);
            if (activePointers.size === 1) {
                const remaining = [...activePointers.values()][0];
                isDragging = true;
                dragStart = { x: remaining.x, y: remaining.y };
                cameraStart = { x: cameraX, y: cameraY };
            } else {
                isDragging = false;
                pinchStartDistance = 0;
            }
        };

        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointercancel', handlePointerUp);

        document.getElementById('toggleLabels').addEventListener('click', (event) => {
            labelsVisible = !labelsVisible;
            event.currentTarget.textContent = labelsVisible ? '地域ラベルを非表示' : '地域ラベルを表示';
            event.currentTarget.setAttribute('aria-pressed', String(labelsVisible));
            scheduleRender();
        });

        document.getElementById('backToGame').onclick = () => {
            document.getElementById('loadingOverlay')?.removeAttribute('hidden');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'fogsgear:close-page' }, window.location.origin);
                return;
            }
            if (document.referrer.endsWith('/MapSystem/index.html')) {
                window.history.back();
                return;
            }
            window.location.href = 'index.html';
        };

        scheduleRender();
        requestAnimationFrame(() => document.getElementById('loadingOverlay')?.setAttribute('hidden', ''));
    </script>
</body>
</html>
