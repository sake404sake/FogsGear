<div id="catalog"></div>
<p class="review-note">大きな建築は施工地形「基礎」を先に敷き、その上へ建てる想定です。簡易ストレージ、手回しポンプ、圧力計台、スチームベントなどの小型インフラは基礎不要。基礎材と施工レシピは未設計です。</p>

<script>
function intermeshedGear(centerX,centerY,radius,toothCount,color,rotation=0){
	const rootRadius=radius*.72;
	const step=Math.PI*2/toothCount;
	const points=[];
	for(let tooth=0;tooth<toothCount;tooth++){
		const base=rotation+tooth*step;
		for(const [offset,r] of [[-.5,rootRadius],[-.32,rootRadius],[-.32,radius], [.32,radius],[.32,rootRadius],[.5,rootRadius]]){
			const angle=base+offset*step;
			points.push(`${(centerX+Math.cos(angle)*r).toFixed(2)},${(centerY+Math.sin(angle)*r).toFixed(2)}`);
		}
	}
	const spokes=[0,60,120].map(degrees=>{const angle=(degrees+rotation*180/Math.PI)*Math.PI/180;return `M${(centerX+Math.cos(angle)*radius*.22).toFixed(2)} ${(centerY+Math.sin(angle)*radius*.22).toFixed(2)}L${(centerX+Math.cos(angle)*radius*.62).toFixed(2)} ${(centerY+Math.sin(angle)*radius*.62).toFixed(2)}`}).join('');
	return `<g class="dome-gear"><path d="M${points.join('L')}Z" fill="${color}" stroke="#283936" stroke-width="1.4"/><circle cx="${centerX}" cy="${centerY}" r="${(radius*.47).toFixed(2)}" fill="#30433d" stroke="#ead080" stroke-width="1.2"/><path d="${spokes}" fill="none" stroke="#e0c675" stroke-width="1.4"/><circle cx="${centerX}" cy="${centerY}" r="${(radius*.2).toFixed(2)}" fill="#bf8a4b" stroke="#34443d" stroke-width="1"/><circle cx="${centerX}" cy="${centerY}" r="${(radius*.07).toFixed(2)}" fill="#c9d0c1"/></g>`;
}

for(const group of groups){

	const item=groups.find(group=>group.id===groupId)?.items.find(entry=>entry.name===itemName);
	if(item)item.legacySymbol=symbol;

glyphs.foundationTile='<rect x="4" y="4" width="88" height="88" fill="#909799" stroke="#394144" stroke-width="4"/><path d="M4 26h88M4 48h88M4 70h88M26 4v88m22-88v88m22-88v88" fill="none" stroke="#6e7779" stroke-width="3"/><path d="M9 9h78v78H9z" fill="none" stroke="#c1c6c7" stroke-width="2"/><circle cx="48" cy="48" r="10" fill="#b8bdbd" stroke="#4b5355" stroke-width="3"/>';

function renderIcon(item){
	const isTile=item.tile;
	const foundation=isTile?'':`<path d="M12 77h72l-8 9H20z" fill="#080d0b" opacity=".65"/><path d="M15 72h66l-7 8H22z" fill="#4c5548" stroke="#cfaa5d" stroke-width="2"/>`;
	const drawing=item.legacySymbol?`<use href="#${item.legacySymbol}" x="4" y="4" width="88" height="88"/>`:`${foundation}${glyphs[item.art]}`;
	return `<svg viewBox="0 0 96 96" preserveAspectRatio="none" role="img" aria-label="${item.name} ${item.size}"><title>${item.name} / ${item.size}</title>${drawing}</svg>`;
}
function expandArtworkToBounds(svg){
	const bounds=svg.getBBox();
	if(!bounds.width||!bounds.height)return;
	const padding=1;
	svg.setAttribute('viewBox',`${bounds.x-padding} ${bounds.y-padding} ${bounds.width+padding*2} ${bounds.height+padding*2}`);
	svg.setAttribute('preserveAspectRatio','none');
}
function renderFootprint(item){
	const [cellsWide,cellsHigh]=item.size.split('×').map(Number);
	return `<div class="object-placement"><span class="placement-caption">占有セル / 1セル = 32px</span><div class="footprint-line"><div class="footprint-board" style="--cells-wide:${cellsWide};--cells-high:${cellsHigh}" role="img" aria-label="${cellsWide}列×${cellsHigh}行の占有セル"></div><div class="footprint-data"><strong>${cellsWide}×${cellsHigh} セル</strong><span>${cellsWide*32}×${cellsHigh*32} px</span></div></div></div>`;
}
const catalog=document.getElementById('catalog');
let total=0;
for(const group of groups){
	total+=group.items.length;
	const section=document.createElement('section');
	section.className='catalog-group';
	section.id=group.id;
	const cards=group.items.map(item=>`<article class="object-card${item.tile?' tile':''}" style="--item-accent:${item.accent}"><div class="object-art">${renderIcon(item)}</div>${renderFootprint(item)}<div class="object-copy"><div class="object-title-row"><h3>${item.name}</h3><span class="object-size">${item.size}</span></div><p>${item.desc}</p><small class="object-materials">${item.materials}</small></div></article>`).join('');
	section.innerHTML=`<div class="group-head"><h2>${group.name}</h2><p>${group.items.length}案</p></div><div class="object-grid">${cards}</div>`;
	catalog.append(section);
}
document.querySelectorAll('.object-art svg').forEach(expandArtworkToBounds);
document.getElementById('item-count').textContent=String(total);
function renderPlacementExamples(){
	const perCell=14;
	document.querySelector('#placement header p').textContent=`実ゲーム1セル=32px。灰色は基礎、表示は一律${perCell}px/セル。`;
	const findItem=name=>groups.flatMap(group=>group.items).find(item=>item.name===name);
	const foundationExemptions=new Set(['簡易ストレージ','手回し式揚管ポンプ','圧力計ペデスタル塔','霧よけスチームベント']);
	const examples=[
		{title:'開拓初期の作業区画',cols:6,rows:5,placements:[['簡易炉',0,0],['簡易ストレージ',2,0],['手回し式揚管ポンプ',4,0],['歯車生成炉',0,2]]},
		{title:'中核生産区画',cols:9,rows:7,placements:[['蒸気ボイラー＆鍛造炉',0,0],['水洗選鉱プラント',3,0],['真鍮工房',6,0],['蒸気駆動機械旋盤所',0,3],['貨物駅',4,3],['蒸気炉塔',7,2]]},
		{title:'大型拠点',cols:15,rows:8,placements:[['開拓地総司令グランドギルド',0,0],['大型飛空艇ドックヤード',7,0]]},
		{title:'最終施設',cols:16,rows:16,placements:[['新天地テラフォーミングドーム',0,0]]}
	];
	const container=document.getElementById('placement-examples');
	container.innerHTML=examples.map(example=>{
		const buildings=example.placements.map(([name,x,y])=>{
			const item=findItem(name);
			const [width,height]=item.size.split('×').map(Number);
			const needsFoundation=!item.tile&&!foundationExemptions.has(name);
			const footprintStyle=`left:${x*perCell}px;top:${y*perCell}px;width:${width*perCell}px;height:${height*perCell}px`;
			const foundation=needsFoundation?`<div class="foundation-area" data-ground="FOUNDATION" style="${footprintStyle}"></div>`:'';
			const building=`<div class="placed-building" data-blocks-movement="true" data-requires-foundation="${needsFoundation}" data-footprint="${width}×${height}" aria-label="${name} ${width}×${height}セル、footprint全域は通行不可" style="--item-accent:${item.accent};${footprintStyle}">${renderIcon(item)}</div>`;
			return `${foundation}${building}`;
		}).join('');
		return `<article class="placement-sample"><h3>${example.title}</h3><div class="placement-board" style="--board-width:${example.cols*perCell}px;--board-height:${example.rows*perCell}px;--cell-size:${perCell}px;width:${example.cols*perCell}px;height:${example.rows*perCell}px">${buildings}</div><p>${example.cols}×${example.rows}セル / 建物は実寸比で配置</p></article>`;
	}).join('');
	container.querySelectorAll('.placed-building svg').forEach(expandArtworkToBounds);
		const ruleNote=document.createElement('p');
		ruleNote.className='review-note';
		ruleNote.textContent='歩行ルール案: 建物の占有 footprint 全セルは通行不可。絵に描かれない内側の余白も建物用地として予約し、歩行可能な通路や中庭を作る場合は別の通行セルとして明示します。ゲーム内移動判定には未接続です。';
		container.after(ruleNote);
}
renderPlacementExamples();
