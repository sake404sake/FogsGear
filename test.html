<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>フォグ・サーモダイナミクス：スタイリッシュUI</title>
    <style>
        :root {
            --bg-deep: #120e0c;
            --panel-bg: linear-gradient(135deg, #241d18 0%, #17120f 100%);
            --border-gold: #c5a059;
            --border-sub: #4a3b2c;
            --text-main: #e2d9cd;
            --text-muted: #9c8e80;
            --accent-gold: #f3c653;
            --accent-red: #8b2626;
            --layer-1: #d4af37; /* 1段目: 金色 */
            --layer-2: #c0c0c0; /* 2段目: シルバー */
            --layer-3: #b87333; /* 3段目: 銅色 */
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 12px;
            overflow-y: auto;
            touch-action: pan-y pinch-zoom;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-gold);
            max-width: 650px;
            margin: 0 auto 8px auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(197, 160, 89, 0.05);
            padding: 12px 16px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .status-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-sub);
            margin-bottom: 10px;
            align-items: center;
        }

        .status-value {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.95rem;
            font-family: monospace;
        }

        .creative-toggle {
            background: #2a211a;
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            padding: 2px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .creative-toggle.active {
            background: var(--accent-gold);
            color: #120e0c;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(243, 198, 83, 0.5);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .group-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            background: #1c1511;
            color: var(--text-main);
            border: 1px solid var(--border-sub);
            padding: 6px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--border-gold);
            background: #2a211a;
        }

        .btn-size.active {
            background: var(--accent-red);
            color: #fff;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(139, 38, 38, 0.5);
            font-weight: bold;
        }

        .btn-layer {
            border-color: var(--border-sub);
        }
        #btn-layer-0.active {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--layer-1);
            color: #ffe89e;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }
        #btn-layer-1.active {
            background: rgba(192, 192, 192, 0.2);
            border-color: var(--layer-2);
            color: #e6e6e6;
            box-shadow: 0 0 8px rgba(192, 192, 192, 0.3);
        }
        #btn-layer-2.active {
            background: rgba(184, 115, 51, 0.2);
            border-color: var(--layer-3);
            color: #e8a87c;
            box-shadow: 0 0 8px rgba(184, 115, 51, 0.3);
        }

        .btn-action {
            background: #182018;
            border-color: #324a32;
            color: #b0d4b0;
            padding: 6px 16px;
            font-weight: bold;
            flex: 1;
            min-width: 90px;
            text-align: center;
        }

        .btn-action:hover:not(:disabled) {
            background: #233223;
            border-color: #558055;
            color: #fff;
        }

        .btn-reset {
            background: #261515;
            border-color: #5a2e2e;
            color: #d99b9b;
            padding: 6px 16px;
        }

        .btn-reset:hover {
            background: #3d1c1c;
            border-color: #8c3b3b;
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .rule-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
        .rule-text b {
            color: var(--text-main);
        }

        #canvas-container {
            display: inline-block;
            border: 2px solid var(--border-sub);
            background: radial-gradient(circle at center, #1c1511 0%, #0a0807 100%);
            border-radius: 6px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            touch-action: none;
            margin-bottom: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            touch-action: none;
        }
    </style>
</head>
<body>

    <!-- 上部パネル：ステータス・ギアサイズ選択 -->
    <div class="panel">
        <h1>Fog Thermodynamics</h1>
        <div class="status-container">
            <div>スチーム力: <span id="steamPower" class="status-value">100</span></div>
            <div>真鍮資材: <span id="brass" class="status-value">300</span></div>
            <div><button id="creativeBtn" class="creative-toggle" onclick="toggleCreativeMode()">クリエイティブ: OFF</button></div>
        </div>
        <div class="control-group">
            <span class="group-label">— Gear Type Selector —</span>
            <div class="button-row">
                <button class="btn btn-size" id="btn-XXS" onclick="selectSize('XXS')">XXS(4)</button>
                <button class="btn btn-size" id="btn-SS" onclick="selectSize('SS')">SS(6)</button>
                <button class="btn btn-size" id="btn-S" onclick="selectSize('S')">S(10)</button>
                <button class="btn btn-size active" id="btn-M" onclick="selectSize('M')">M(14)</button>
                <button class="btn btn-size" id="btn-L" onclick="selectSize('L')">L(18)</button>
                <button class="btn btn-size" id="btn-LL" onclick="selectSize('LL')">LL(24)</button>
                <button class="btn btn-size" id="btn-3L" onclick="selectSize('3L')">3L(32)</button>
                <button class="btn btn-size" id="btn-4L" onclick="selectSize('4L')">4L(40)</button>
                <button class="btn btn-size" id="btn-MAX" onclick="selectSize('MAX')">MAX(48)</button>
            </div>
        </div>
    </div>

    <!-- マップ描画エリア -->
    <div id="canvas-container">
        <canvas id="gearCanvas" width="800" height="600"></canvas>
    </div>

    <!-- 下部パネル：レイヤー選択・アクション操作盤 -->
    <div class="panel">
        <div class="control-group" style="margin-bottom: 8px;">
            <span class="group-label">— Layer Selector —</span>
            <div class="button-row">
                <button class="btn btn-layer active" id="btn-layer-0" onclick="selectLayer(0)">1段目 (金)</button>
                <button class="btn btn-layer" id="btn-layer-1" onclick="selectLayer(1)">2段目 (銀)</button>
                <button class="btn btn-layer" id="btn-layer-2" onclick="selectLayer(2)">3段目 (銅)</button>
            </div>
        </div>
        
        <div class="control-group">
            <span class="group-label">— Operation Panel —</span>
            <div class="button-row" style="width: 100%;">
                <button class="btn btn-action" id="btn-undo" onclick="undoAction()" disabled>↩ Undo</button>
                <button class="btn btn-action" id="btn-redo" onclick="redoAction()" disabled>Redo ↪</button>
                <button class="btn btn-reset" onclick="resetGameData()">盤面リセット</button>
            </div>
        </div>

        <div class="rule-text">
            同一レイヤーの重複配置不可。近接時は綺麗に噛み合う位置へ自動補正。除去は中心付近タップ。
        </div>
    </div>

<script>
const canvas = document.getElementById('gearCanvas');
const ctx = canvas.getContext('2d');

const PITCH = 2; 

function pixelToHex(x, y) {
    let q = (Math.sqrt(3)/3 * x - 1/3 * y) / PITCH;
    let r = (2/3 * y) / PITCH;
    let z = -q - r;
    let rq = Math.round(q), rr = Math.round(r), rz = Math.round(z);
    let q_diff = Math.abs(rq - q), r_diff = Math.abs(rr - r), z_diff = Math.abs(rz - z);
    if (q_diff > r_diff && q_diff > z_diff) rq = -rr - rz;
    else if (r_diff > z_diff) rr = -rq - rz;
    return { q: rq, r: rr };
}

function hexToPixel(q, r) {
    return {
        x: PITCH * Math.sqrt(3) * (q + r/2),
        y: PITCH * 3/2 * r
    };
}

let gears = [];
let steamPower = 100;
let brass = 300;
let creativeMode = false;
let selectedSize = 'M';
let selectedLayer = 0;
let zoomScale = 1.0;
let offsetX = 0;
let offsetY = 0;

let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 30;

const GEAR_SPECS = {
    'XXS':  { teeth: 4,  r: 12,  cost: 5,   pattern: 'solid' },         
    'SS':   { teeth: 6,  r: 18,  cost: 10,  pattern: 'cross_holes' },   
    'S':    { teeth: 10, r: 30,  cost: 15,  pattern: 'tri_spoke' },     
    'M':    { teeth: 14, r: 42,  cost: 25,  pattern: 'quad_spoke' },    
    'L':    { teeth: 18, r: 54,  cost: 35,  pattern: 'penta_spoke' },   
    'LL':   { teeth: 24, r: 72,  cost: 50,  pattern: 'hexa_holes' },    
    '3L':   { teeth: 32, r: 96,  cost: 70,  pattern: 'spiral' },        
    '4L':   { teeth: 40, r: 120, cost: 95,  pattern: 'heavy_spoke' },   
    'MAX':  { teeth: 48, r: 144, cost: 120, pattern: 'wheel' }          
};

// 1段目: 金色, 2段目: シルバー, 3段目: 銅色
const LAYER_COLORS = [
    { fill: '#d4af37', stroke: '#ffea9f' }, // 1段目: 金
    { fill: '#b5b8b1', stroke: '#e6eae3' }, // 2段目: シルバー
    { fill: '#b87333', stroke: '#f3b06c' }  // 3段目: 銅
];

class Gear {
    constructor(q, r, size, layer = 0, isCore = false) {
        this.q = q;
        this.r = r;
        let pos = hexToPixel(q, r);
        this.x = pos.x;
        this.y = pos.y;
        this.size = size;
        this.layer = layer;
        this.teeth = GEAR_SPECS[size].teeth;
        this.radius = GEAR_SPECS[size].r;
        this.cost = GEAR_SPECS[size].cost;
        this.pattern = GEAR_SPECS[size].pattern;
        
        this.angle = 0;
        this.isCore = isCore;
        this.powered = isCore;
        this.rotationDir = isCore ? 1 : 0;
        this.isDeadlocked = false;
    }
}

function toggleCreativeMode() {
    creativeMode = !creativeMode;
    let btn = document.getElementById('creativeBtn');
    btn.classList.toggle('active', creativeMode);
    btn.innerText = `クリエイティブ: ${creativeMode ? 'ON' : 'OFF'}`;
}

function selectSize(size) {
    if (selectedSize === size) {
        selectedSize = null;
    } else {
        selectedSize = size;
    }

    Object.keys(GEAR_SPECS).forEach(s => {
        let btn = document.getElementById('btn-' + s);
        if (btn) btn.classList.toggle('active', s === selectedSize);
    });
    
    if (!selectedSize) {
        ghostGear = null;
    }
}

function selectLayer(layer) {
    selectedLayer = layer;
    for (let i = 0; i < 3; i++) {
        let btn = document.getElementById('btn-layer-' + i);
        if (btn) btn.classList.toggle('active', i === selectedLayer);
    }
}

function pushStateToHistory() {
    const currentState = {
        gears: gears.map(g => ({ q: g.q, r: g.r, size: g.size, layer: g.layer, isCore: g.isCore })),
        brass: brass,
        steamPower: steamPower
    };
    undoStack.push(currentState);
    if (undoStack.length > MAX_HISTORY) {
        undoStack.shift();
    }
    redoStack = [];
    updateHistoryButtons();
    saveGameData();
}

function updateHistoryButtons() {
    document.getElementById('btn-undo').disabled = undoStack.length === 0;
    document.getElementById('btn-redo').disabled = redoStack.length === 0;
}

function undoAction() {
    if (undoStack.length === 0) return;
    
    const currentState = {
        gears: gears.map(g => ({ q: g.q, r: g.r, size: g.size, layer: g.layer, isCore: g.isCore })),
        brass: brass,
        steamPower: steamPower
    };
    redoStack.push(currentState);

    const prevState = undoStack.pop();
    restoreState(prevState);
    updateHistoryButtons();
    saveGameData();
}

function redoAction() {
    if (redoStack.length === 0) return;

    const currentState = {
        gears: gears.map(g => ({ q: g.q, r: g.r, size: g.size, layer: g.layer, isCore: g.isCore })),
        brass: brass,
        steamPower: steamPower
    };
    undoStack.push(currentState);

    const nextState = redoStack.pop();
    restoreState(nextState);
    updateHistoryButtons();
    saveGameData();
}

function restoreState(state) {
    brass = state.brass;
    steamPower = state.steamPower;
    gears = state.gears.map(g => new Gear(g.q, g.r, g.size, g.layer, g.isCore));
    updatePowerGrid();
}

function saveGameData() {
    const saveData = {
        gears: gears.map(g => ({ q: g.q, r: g.r, size: g.size, layer: g.layer, isCore: g.isCore })),
        brass: brass,
        steamPower: steamPower,
        undoStack: undoStack,
        redoStack: redoStack
    };
    localStorage.setItem('fog_thermo_save', JSON.stringify(saveData));
}

function loadGameData() {
    const saved = localStorage.getItem('fog_thermo_save');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            brass = data.brass !== undefined ? data.brass : 300;
            steamPower = data.steamPower !== undefined ? data.steamPower : 100;
            gears = data.gears.map(g => new Gear(g.q, g.r, g.size, g.layer, g.isCore));
            undoStack = data.undoStack || [];
            redoStack = data.redoStack || [];
            updatePowerGrid();
            updateHistoryButtons();
            return;
        } catch (e) {
            console.error('セーブデータの読み込みに失敗しました', e);
        }
    }
    initGameDefault();
}

function initGameDefault() {
    gears = [];
    steamPower = 100;
    brass = 300;
    undoStack = [];
    redoStack = [];
    gears.push(new Gear(0, 0, 'LL', 0, true));
    updatePowerGrid();
    updateHistoryButtons();
    saveGameData();
}

function resetGameData() {
    if (confirm('盤面のギアと資材を初期状態にリセットしますか？')) {
        localStorage.removeItem('fog_thermo_save');
        initGameDefault();
    }
}

function drawHexGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(139, 115, 85, 0.2)';
    ctx.lineWidth = 1.2;
    
    let range = 12;
    let activeAxes = new Set();
    gears.forEach(g => activeAxes.add(`${g.q},${g.r}`));

    for (let q = -range; q <= range; q++) {
        for (let r = -range; r <= range; r++) {
            if (Math.abs(q + r) > range) continue;
            let pos = hexToPixel(q, r);
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = (i * Math.PI / 3) + (Math.PI / 6);
                let hexR = PITCH * Math.sqrt(3) * 0.95;
                let hx = pos.x + hexR * Math.cos(angle);
                let hy = pos.y + hexR * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            
            if (activeAxes.has(`${q},${r}`)) {
                ctx.fillStyle = 'rgba(212, 175, 55, 0.06)';
                ctx.fill();
            }
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawGearPattern(r, pattern, isGhost) {
    ctx.fillStyle = isGhost ? 'rgba(0,0,0,0.15)' : '#1a1614';
    ctx.strokeStyle = isGhost ? 'rgba(255,255,255,0.4)' : '#332922';
    ctx.lineWidth = 1.5;

    if (pattern === 'solid') {
    } else if (pattern === 'cross_holes') {
        for (let i = 0; i < 4; i++) {
            let a = i * (Math.PI / 2);
            ctx.beginPath();
            ctx.arc(r * 0.42 * Math.cos(a), r * 0.42 * Math.sin(a), r * 0.22, 0, Math.PI * 2);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'tri_spoke') {
        for (let i = 0; i < 3; i++) {
            let a1 = i * (Math.PI * 2 / 3) + 0.15;
            let a2 = (i + 1) * (Math.PI * 2 / 3) - 0.15;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.65, a1, a2);
            ctx.arc(0, 0, r * 0.3, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'quad_spoke') {
        for (let i = 0; i < 4; i++) {
            let a1 = i * (Math.PI / 2) + 0.12;
            let a2 = (i + 1) * (Math.PI / 2) - 0.12;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.7, a1, a2);
            ctx.arc(0, 0, r * 0.28, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'penta_spoke') {
        for (let i = 0; i < 5; i++) {
            let a1 = i * (Math.PI * 2 / 5) + 0.1;
            let a2 = (i + 1) * (Math.PI * 2 / 5) - 0.1;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.72, a1, a2);
            ctx.arc(0, 0, r * 0.28, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'hexa_holes') {
        for (let i = 0; i < 6; i++) {
            let a = i * (Math.PI / 3);
            ctx.beginPath();
            ctx.arc(r * 0.52 * Math.cos(a), r * 0.52 * Math.sin(a), r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
        if (!isGhost) ctx.stroke();
    } else if (pattern === 'spiral') {
        for (let i = 0; i < 6; i++) {
            let a1 = i * (Math.PI / 3);
            let a2 = a1 + 0.8;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.75, a1, a2);
            ctx.arc(0, 0, r * 0.35, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'heavy_spoke') {
        for (let i = 0; i < 6; i++) {
            let a1 = i * (Math.PI / 3) + 0.08;
            let a2 = (i + 1) * (Math.PI / 3) - 0.08;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.8, a1, a2);
            ctx.arc(0, 0, r * 0.32, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
    } else if (pattern === 'wheel') {
        for (let i = 0; i < 8; i++) {
            let a1 = i * (Math.PI / 4) + 0.06;
            let a2 = (i + 1) * (Math.PI / 4) - 0.06;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.82, a1, a2);
            ctx.arc(0, 0, r * 0.35, a2, a1, true);
            ctx.fill();
            if (!isGhost) ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
        if (!isGhost) ctx.stroke();
    }
}

function drawGear(gear, isGhost = false, ghostValid = true) {
    let r = gear.radius;
    let t = gear.teeth;
    let fillColor, strokeColor;

    if (isGhost) {
        if (ghostValid) {
            let palette = LAYER_COLORS[selectedLayer % 3];
            fillColor = palette.fill.replace(')', ', 0.5)').replace('rgb', 'rgba');
            strokeColor = palette.stroke;
        } else {
            fillColor = 'rgba(210, 30, 30, 0.65)';
            strokeColor = 'rgba(255, 100, 100, 1.0)';
        }
    } else {
        if (gear.isDeadlocked) {
            fillColor = '#8b0000';
            strokeColor = '#ff4d4d';
        } else if (gear.isCore) {
            fillColor = '#f5c942';
            strokeColor = '#fff3b0';
        } else {
            let palette = LAYER_COLORS[gear.layer % 3];
            fillColor = gear.powered ? palette.fill : '#3d322c';
            strokeColor = gear.powered ? palette.stroke : '#201a17';
        }
    }

    ctx.save();
    ctx.translate(gear.x, gear.y);

    if (gear.isCore && !isGhost) {
        ctx.shadowColor = '#ffe066';
        ctx.shadowBlur = 20;
    }

    ctx.rotate(gear.angle);

    ctx.fillStyle = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = isGhost ? 2.5 : (gear.isCore ? 3 : 1.5);
    ctx.beginPath();
    ctx.arc(0, 0, r - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (gear.isCore && !isGhost) {
        ctx.shadowBlur = 0;
    }

    let toothW = r > 100 ? 5 : (r > 60 ? 6 : 7);
    let toothH = r > 100 ? 7 : (r > 60 ? 8 : 6);
    for (let i = 0; i < t; i++) {
        ctx.save();
        ctx.rotate(i * (Math.PI * 2) / t);
        ctx.beginPath();
        ctx.rect(r - 3 - toothH/2, -toothW/2, toothH, toothW);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    if (gear.isCore && !isGhost) {
        ctx.strokeStyle = '#7c5c14';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
        ctx.stroke();

        for (let i = 0; i < 8; i++) {
            ctx.save();
            ctx.rotate(i * (Math.PI / 4));
            ctx.fillStyle = '#b38827';
            ctx.fillRect(-3, -r * 0.75, 6, r * 0.3);
            ctx.restore();
        }

        ctx.fillStyle = '#1a1614';
        for (let i = 0; i < 8; i++) {
            let a1 = i * (Math.PI / 4) + 0.08;
            let a2 = (i + 1) * (Math.PI / 4) - 0.08;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.7, a1, a2);
            ctx.arc(0, 0, r * 0.32, a2, a1, true);
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    } else {
        drawGearPattern(r, gear.pattern, isGhost);
    }

    if (gear.isCore && !isGhost) {
        ctx.fillStyle = '#9e2a2b';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-3, -3, 3, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = isGhost ? 'rgba(255,255,255,0.7)' : '#d1c7bd';
        ctx.beginPath();
        ctx.arc(0, 0, r < 20 ? 2.5 : 4.5, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();

    if (!isGhost && gear.layer > 0) {
        ctx.save();
        ctx.fillStyle = '#f0c674';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(`L${gear.layer + 1}`, gear.x - 10, gear.y - r + 10);
        ctx.restore();
    }
}

function updatePowerGrid() {
    gears.forEach(g => {
        g.powered = false;
        g.rotationDir = 0;
        g.isDeadlocked = false;
    });

    let core = gears.find(g => g.isCore);
    if (!core) return;

    core.powered = true;
    core.rotationDir = 1;

    let queue = [core];
    let visitedDirs = new Map();
    visitedDirs.set(`${core.q},${core.r},${core.layer}`, 1);

    while (queue.length > 0) {
        let curr = queue.shift();
        let expectedDir = -curr.rotationDir;

        for (let other of gears) {
            if (curr === other) continue;
            let dist = Math.hypot(curr.x - other.x, curr.y - other.y);
            let isSamePosition = (curr.q === other.q && curr.r === other.r && Math.abs(curr.layer - other.layer) === 1);
            let isMeshing = (dist <= curr.radius + other.radius + 3 && curr.layer === other.layer);

            if (isSamePosition || isMeshing) {
                let key = `${other.q},${other.r},${other.layer}`;
                let targetDir = isSamePosition ? curr.rotationDir : expectedDir;

                if (visitedDirs.has(key)) {
                    if (visitedDirs.get(key) !== targetDir) {
                        other.isDeadlocked = true;
                        curr.isDeadlocked = true;
                    }
                } else {
                    other.powered = true;
                    other.rotationDir = targetDir;
                    visitedDirs.set(key, targetDir);
                    queue.push(other);
                }
            }
        }
    }

    let changed = true;
    while (changed) {
        changed = false;
        for (let curr of gears) {
            if (curr.isDeadlocked) continue;
            for (let other of gears) {
                if (other.isDeadlocked) {
                    let dist = Math.hypot(curr.x - other.x, curr.y - other.y);
                    let isSamePosition = (curr.q === other.q && curr.r === other.r && Math.abs(curr.layer - other.layer) === 1);
                    let isMeshing = (dist <= curr.radius + other.radius + 3 && curr.layer === other.layer);
                    if (isSamePosition || isMeshing) {
                        curr.isDeadlocked = true;
                        changed = true;
                    }
                }
            }
        }
    }
}

function updateGame() {
    updatePowerGrid();

    let activeCount = 0;
    gears.forEach(g => {
        if (g.powered && !g.isDeadlocked) {
            activeCount++;
            let speed = 0.012 * (24 / g.teeth) * g.rotationDir;
            if (g.layer > 0) speed *= (g.layer % 2 === 0 ? 1 : -1);
            g.angle += speed;
        }
    });

    if (creativeMode) {
        steamPower = 200;
        brass = 9999;
    } else {
        steamPower = Math.min(200, Math.max(0, steamPower + 0.1 - (activeCount * 0.05)));
        if (activeCount > 1 && steamPower > 5) {
            brass += activeCount * 0.01;
        }
    }

    document.getElementById('steamPower').innerText = Math.floor(steamPower);
    document.getElementById('brass').innerText = creativeMode ? 'MAX' : Math.floor(brass);
}

let ghostGear = null;

function updateGhost(mouseX, mouseY) {
    if (!selectedSize) {
        ghostGear = null;
        return;
    }

    let offsetYOffset = -110; 
    let adjustedMouseY = mouseY + offsetYOffset;

    let targetX = (mouseX - canvas.width/2) / zoomScale - offsetX;
    let targetY = (adjustedMouseY - canvas.height/2) / zoomScale - offsetY;
    let spec = GEAR_SPECS[selectedSize];
    
    let targetLayer = selectedLayer;
    let valid = true;
    if (targetLayer >= 3) valid = false;
    if (!creativeMode && brass < spec.cost) valid = false;

    let sameLayerGears = gears.filter(g => g.layer === targetLayer);
    
    let nearestGear = null;
    let minGearDist = Infinity;
    for (let g of sameLayerGears) {
        let d = Math.hypot(targetX - g.x, targetY - g.y);
        if (d < minGearDist) {
            minGearDist = d;
            nearestGear = g;
        }
    }

    let pos = { x: targetX, y: targetY };
    let hex = pixelToHex(targetX, targetY);

    if (nearestGear && minGearDist < nearestGear.radius + spec.r + 50) {
        let meshDist = nearestGear.radius + spec.r;
        let angleToTarget = Math.atan2(targetY - nearestGear.y, targetX - nearestGear.x);
        
        let meshedX = nearestGear.x + Math.cos(angleToTarget) * meshDist;
        let meshedY = nearestGear.y + Math.sin(angleToTarget) * meshDist;

        let canPlaceMeshed = true;
        for (let g of sameLayerGears) {
            if (g === nearestGear) continue;
            let d = Math.hypot(meshedX - g.x, meshedY - g.y);
            if (d < spec.r + g.radius - 2) {
                canPlaceMeshed = false;
                break;
            }
        }

        if (canPlaceMeshed) {
            pos.x = meshedX;
            pos.y = meshedY;
            let hexCoord = pixelToHex(pos.x, pos.y);
            hex.q = hexCoord.q;
            hex.r = hexCoord.r;
        } else {
            valid = false;
        }
    } else {
        let closestExistingAxis = null;
        let minAxisDist = 65;
        
        let uniqueAxes = [];
        let axisMap = new Map();
        gears.forEach(g => {
            let key = `${g.q},${g.r}`;
            if (!axisMap.has(key)) {
                let p = hexToPixel(g.q, g.r);
                axisMap.set(key, { q: g.q, r: g.r, x: p.x, y: p.y });
                uniqueAxes.push(axisMap.get(key));
            }
        });

        for (let axis of uniqueAxes) {
            let d = Math.hypot(targetX - axis.x, targetY - axis.y);
            if (d < minAxisDist) {
                minAxisDist = d;
                closestExistingAxis = axis;
            }
        }

        if (closestExistingAxis) {
            hex = { q: closestExistingAxis.q, r: closestExistingAxis.r };
        }
        let snappedPos = hexToPixel(hex.q, hex.r);
        pos.x = snappedPos.x;
        pos.y = snappedPos.y;

        for (let g of sameLayerGears) {
            let d = Math.hypot(pos.x - g.x, pos.y - g.y);
            if (g.q === hex.q && g.r === hex.r || d < spec.r + g.radius - 2) {
                valid = false;
            }
        }
    }

    ghostGear = { 
        x: pos.x, y: pos.y, q: hex.q, r: hex.r, layer: targetLayer, 
        radius: spec.r, teeth: spec.teeth, pattern: spec.pattern, angle: 0, valid: valid 
    };
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(zoomScale, zoomScale);
    ctx.translate(offsetX, offsetY);

    drawHexGrid();

    let sortedGears = [...gears].sort((a, b) => a.layer - b.layer);
    sortedGears.forEach(g => drawGear(g));
    
    if (ghostGear && selectedSize) {
        drawGear(ghostGear, true, ghostGear.valid);
    }

    ctx.restore();
}

function gameLoop() {
    updateGame();
    render();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('pointerdown', e => {
    const panels = document.querySelectorAll('.panel');
    let insidePanel = false;
    panels.forEach(p => { if (p.contains(e.target)) insidePanel = true; });
    
    if (!canvas.contains(e.target) && !insidePanel) {
        if (selectedSize) {
            selectSize(selectedSize);
        }
    }
});

let activeTouches = new Map();
let initialPinchDist = null;
let initialZoom = zoomScale;
let startX, startY;
let initOffsetX, initOffsetY;

canvas.addEventListener('pointerdown', e => {
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    
    if (activeTouches.size === 1) {
        initialPinchDist = null;
        startX = e.clientX;
        startY = e.clientY;
        initOffsetX = offsetX;
        initOffsetY = offsetY;
    } else if (activeTouches.size === 2 && !selectedSize) {
        let touches = Array.from(activeTouches.values());
        initialPinchDist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        initialZoom = zoomScale;
    }
    canvas.setPointerCapture(e.pointerId);

    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    updateGhost(mx, my);
});

canvas.addEventListener('pointermove', e => {
    if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }

    if (selectedSize) {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);
        updateGhost(mx, my);
        return;
    }

    if (activeTouches.size === 2 && initialPinchDist !== null) {
        let touches = Array.from(activeTouches.values());
        let dist = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
        
        if (initialPinchDist > 0) {
            let scaleFactor = dist / initialPinchDist;
            zoomScale = Math.max(0.4, Math.min(2.5, initialZoom * scaleFactor));
        }
        return;
    }

    const rect = canvas.getBoundingClientRect();
    let dx = e.clientX - startX;
    let dy = e.clientY - startY;

    if (activeTouches.size === 1) {
        offsetX = initOffsetX + dx / zoomScale;
        offsetY = initOffsetY + dy / zoomScale;
    }

    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    updateGhost(mx, my);
});

canvas.addEventListener('pointerup', e => {
    activeTouches.delete(e.pointerId);
    
    if (activeTouches.size < 2) {
        initialPinchDist = null;
    }
    if (activeTouches.size === 1) {
        let remaining = Array.from(activeTouches.values())[0];
        startX = remaining.x;
        startY = remaining.y;
        initOffsetX = offsetX;
        initOffsetY = offsetY;
    }

    if (activeTouches.size === 0) {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (selectedSize) {
            if (ghostGear && ghostGear.valid) {
                pushStateToHistory();
                if (!creativeMode) {
                    brass -= GEAR_SPECS[selectedSize].cost;
                }
                let newG = new Gear(ghostGear.q, ghostGear.r, selectedSize, ghostGear.layer);
                newG.x = ghostGear.x;
                newG.y = ghostGear.y;
                newG.angle = ghostGear.angle;
                gears.push(newG);
                updatePowerGrid();
                saveGameData();
            }
        } else {
            let targetX = (mx - canvas.width/2) / zoomScale - offsetX;
            let targetY = (my - canvas.height/2) / zoomScale - offsetY;

            let clickedGear = null;
            let sortedDesc = [...gears].sort((a, b) => b.layer - a.layer);
            for (let g of sortedDesc) {
                let coreRadiusCheck = Math.max(12, g.radius * 0.35);
                if (Math.hypot(targetX - g.x, targetY - g.y) < coreRadiusCheck) {
                    clickedGear = g;
                    break;
                }
            }

            if (clickedGear && !clickedGear.isCore) {
                pushStateToHistory();
                if (!creativeMode) {
                    brass += Math.floor(clickedGear.cost * 0.8);
                }
                gears = gears.filter(g => g !== clickedGear);
                updatePowerGrid();
                saveGameData();
            }
        }

        initialPinchDist = -1;
        ghostGear = null;
        updateGhost(mx, my);
    }
});

canvas.addEventListener('pointercancel', e => {
    activeTouches.delete(e.pointerId);
    initialPinchDist = null;
    ghostGear = null;
});

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomScale += e.deltaY > 0 ? -0.1 : 0.1;
    zoomScale = Math.max(0.4, Math.min(2.5, zoomScale));
}, { passive: false });

loadGameData();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
