<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>フォグ・サーモダイナミクス：スタイリッシュUI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 上部パネル：ステータス・ギアサイズ選択 -->
    <div class="panel">
        <h1>Fog Thermodynamics</h1>
        <div class="status-container">
            <div>スチーム力: <span id="steamPower" class="status-value">100</span></div>
            <div>真鍮資材: <span id="brass" class="status-value">300</span></div>
            <div><button id="creativeBtn" class="creative-toggle" data-action="toggle-creative">クリエイティブ: OFF</button></div>
        </div>
        <div class="control-group">
            <span class="group-label">— Gear Type Selector —</span>
            <div class="button-row">
                <button class="btn btn-size" data-size="XXS">XXS(4)</button>
                <button class="btn btn-size" data-size="SS">SS(6)</button>
                <button class="btn btn-size" data-size="S">S(10)</button>
                <button class="btn btn-size active" data-size="M">M(14)</button>
                <button class="btn btn-size" data-size="L">L(18)</button>
                <button class="btn btn-size" data-size="LL">LL(24)</button>
                <button class="btn btn-size" data-size="3L">3L(32)</button>
                <button class="btn btn-size" data-size="4L">4L(40)</button>
                <button class="btn btn-size" data-size="MAX">MAX(48)</button>
            </div>
        </div>
    </div>

    <!-- マップ描画エリア -->
    <div id="canvas-container">
        <canvas id="gearCanvas" width="800" height="600"></canvas>
    </div>

    <!-- 下部パネル：レイヤー選択・アクション操作盤 -->
    <div class="panel">
        <div class="control-group" style="margin-bottom: 8px;">
            <span class="group-label">— Layer Selector —</span>
            <div class="button-row">
                <button class="btn btn-layer active" id="btn-layer-0" data-layer="0">1段目 (金)</button>
                <button class="btn btn-layer" id="btn-layer-1" data-layer="1">2段目 (銀)</button>
                <button class="btn btn-layer" id="btn-layer-2" data-layer="2">3段目 (銅)</button>
            </div>
        </div>
        
        <div class="control-group">
            <span class="group-label">— Operation Panel —</span>
            <div class="button-row" style="width: 100%;">
                <button class="btn btn-action" id="btn-undo" data-action="undo" disabled>↩ Undo</button>
                <button class="btn btn-action" id="btn-redo" data-action="redo" disabled>Redo ↪</button>
                <button class="btn btn-reset" data-action="reset">盤面リセット</button>
            </div>
        </div>

        <div class="rule-text">
            同一レイヤーの重複配置不可。近接時は綺麗に噛み合う位置へ自動補正。除去は中心付近タップ。
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
