<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Gear asset generator</title>
<style>body{margin:0;background:transparent}canvas{display:block}</style>
<body>
<script>
const SIZE = 320;
const designs = {
    industrial: 'industrial',
    alchemical: 'alchemical',
    logistics: 'logistics',
    clockwork: 'clockwork',
    production: 'production'
};

function drawGear(canvas, design) {
    const ctx = canvas.getContext('2d');
    const center = SIZE / 2;
    const radius = 132;
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.save();
    ctx.translate(center, center);
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 5;
    const outerLineWidth = 20;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, radius + 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(0, 0, radius - 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.lineWidth = 5;
    ctx.restore();
    ctx.lineWidth = outerLineWidth;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, radius * 0.78, 0, Math.PI * 2); ctx.stroke();
    drawDesign(ctx, radius, design.style);
    ctx.restore();
}

function drawLineSpokes(ctx, radius, count, inner, outer, width = 7) {
    ctx.lineWidth = width;
    for (let i = 0; i < count; i++) {
        const angle = i * Math.PI * 2 / count;
        ctx.beginPath();
        ctx.moveTo(radius * inner * Math.cos(angle), radius * inner * Math.sin(angle));
        ctx.lineTo(radius * outer * Math.cos(angle), radius * outer * Math.sin(angle));
        ctx.stroke();
    }
}

function holes(ctx, radius, count, scale, size) {
    for (let i = 0; i < count; i++) {
        const angle = i * Math.PI * 2 / count;
        ctx.beginPath();
        ctx.arc(radius * scale * Math.cos(angle), radius * scale * Math.sin(angle), size, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function ring(ctx, radius, scale) {
    ctx.beginPath();
    ctx.arc(0, 0, radius * scale, 0, Math.PI * 2);
    ctx.stroke();
}

function drawDesign(ctx, radius, style) {
    ctx.lineCap = 'round';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, radius * .2, 0, Math.PI * 2);
    ctx.fill();
    if (style === 'industrial') { ring(ctx, radius, .52); drawLineSpokes(ctx, radius, 6, .16, .76, 14); return; }
    if (style === 'alchemical') { ring(ctx, radius, .3); ring(ctx, radius, .58); drawLineSpokes(ctx, radius, 3, .16, .82, 8); return; }
    if (style === 'logistics') { ring(ctx, radius, .68); drawLineSpokes(ctx, radius, 4, .16, .68, 12); ring(ctx, radius, .34); return; }
    if (style === 'clockwork') { ring(ctx, radius, .42); drawLineSpokes(ctx, radius, 8, .16, .72, 5); ring(ctx, radius, .76, 3); return; }
    if (style === 'production') { ring(ctx, radius, .26); ring(ctx, radius, .52); drawLineSpokes(ctx, radius, 8, .26, .78, 6); return; }
    if (style === 'core') {
        drawLineSpokes(ctx, radius, 8, .18, .8, 9);
        holes(ctx, radius, 8, .58, 6);
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, radius * .56, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, radius * .3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, radius * .12, 0, Math.PI * 2); ctx.fill();
    }
}

for (const [designName, style] of Object.entries(designs)) {
    const canvas = document.createElement('canvas');
    canvas.id = `gear-${designName}`;
    canvas.width = SIZE; canvas.height = SIZE;
    document.body.appendChild(canvas);
    drawGear(canvas, { style });
}
</script>
</body>
</html>
